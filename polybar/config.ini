; -----------------------------------------------------------------------------
; Polybar Configuration
; -----------------------------------------------------------------------------

[colors]
background = #2e3440
background-alt = #3b4252
foreground = #d8dee9
primary = #81a1c1
alert = #bf616a
disabled = #4c566a

[bar/main]
width = 100%
height = 24pt
radius = 0
background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt
border-size = 0pt
border-color = #00000000

padding-left = 1
padding-right = 2
module-margin = 1
separator = |
separator-foreground = ${colors.disabled}

; Requires a font installed, defaults to monospace if not found
font-0 = JetBrainsMono Nerd Font:size=10;2

modules-left = bspwm
modules-center = date cpu memory
modules-right = bluetooth pulseaudio brightness wifi battery powermenu

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true
wm-restack = bspwm

[module/bspwm]
type = internal/bspwm

; Workspace format (Active/Occupied/Empty)
label-focused = %name%
label-focused-background = ${colors.background-alt}
label-focused-underline= ${colors.primary}
label-focused-padding = 2

label-occupied = %name%
label-occupied-padding = 2

label-urgent = %name%!
label-urgent-background = ${colors.alert}
label-urgent-padding = 2

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 2

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[module/memory]
type = internal/memory
interval = 2
format-prefix = "RAM "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
interval = 5

format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
label-muted = 󰝟 muted
label-muted-foreground = ${colors.disabled}

ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
ramp-volume-foreground = ${colors.primary}

; Left click: mute, scroll: volume (handled natively), right click: mixer
click-right = pavucontrol &

[module/wifi]
type = internal/network
; Replace with your wireless interface name
interface = wlp147s0
interface-type = wireless
interval = 3

format-connected = <ramp-signal> <label-connected>
label-connected = %essid%
format-disconnected = <label-disconnected>
label-disconnected = 󰤮 off
label-disconnected-foreground = ${colors.disabled}

ramp-signal-0 = 󰤟
ramp-signal-1 = 󰤢
ramp-signal-2 = 󰤥
ramp-signal-3 = 󰤨
ramp-signal-foreground = ${colors.primary}

click-left = nm-connection-editor &

[module/brightness]
type = custom/script
exec = brightnessctl -m | awk -F, '{print "󰃟 " $4}'
interval = 1
scroll-up = brightnessctl set 5%+
scroll-down = brightnessctl set 5%-
; Left click: 100%, right click: 30%
click-left = brightnessctl set 100%
click-right = brightnessctl set 30%

[module/bluetooth]
type = custom/script
exec = ~/.config/polybar/scripts/bluetooth.sh
interval = 3
click-left = ~/.config/polybar/scripts/bluetooth.sh toggle
click-right = blueman-manager &

[module/battery]
type = internal/battery

; Adapt to the names found in /sys/class/power_supply/
battery = BAT0
adapter = AC

; Stop considering the battery full above this level
full-at = 98

; Refresh interval in seconds (also reacts to udev events)
poll-interval = 5

format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = <label-full>

label-charging = %percentage%%
label-discharging = %percentage%%
label-full = 󰁹 %percentage%%

; Icons (requires a Nerd Font)
ramp-capacity-0 = 󰁺
ramp-capacity-1 = 󰁼
ramp-capacity-2 = 󰁾
ramp-capacity-3 = 󰂀
ramp-capacity-4 = 󰁹
ramp-capacity-foreground = ${colors.foreground}

animation-charging-0 = 󰢜
animation-charging-1 = 󰂆
animation-charging-2 = 󰂈
animation-charging-3 = 󰂊
animation-charging-4 = 󰂅
animation-charging-framerate = 750

[module/date]
type = internal/date
interval = 1
date = %Y-%m-%d %H:%M:%S
label = %date%
label-foreground = ${colors.primary}

[module/powermenu]
type = custom/script
exec = echo "󰐥"
label-foreground = ${colors.alert}
click-left = ~/.config/polybar/scripts/powermenu.sh

[settings]
screenchange-reload = true
pseudo-transparency = true
